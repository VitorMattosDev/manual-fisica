project:
  type: book
  output-dir: _book

# IMPORTANTE: lang vai no NÍVEL RAIZ, nunca dentro de `book:`.
# (`book.lang` é inválido e foi o erro que travou o manual de Matemática.)
lang: pt

book:
  title: "Manual de Física"
  subtitle: "Do básico ao avançado"
  author: "SEU-NOME"
  date: today
  search: true
  repo-url: https://github.com/SEU-USUARIO/manual-fisica
  repo-actions: [edit, issue]
  sidebar:
    style: docked
  chapters:
    - index.qmd
    # --- Apenas arquivos que EXISTEM ficam ativos aqui. ---
    # A ordem segue o ROADMAP.md. O capítulo 06 do Volume II é o GABARITO DE ESTILO.
    - part: "Volume I — Fundamentos da Física"
      chapters:
        - volumes/v1-fundamentos/01-grandezas-unidades.qmd
        - volumes/v1-fundamentos/02-analise-dimensional.qmd
        - volumes/v1-fundamentos/03-medicao-erros.qmd
        - volumes/v1-fundamentos/04-vetores.qmd
        - volumes/v1-fundamentos/05-ferramentas-calculo.qmd
        - volumes/v1-fundamentos/06-modelagem.qmd
    - part: "Volume II — Mecânica Clássica I"
      chapters:
        - volumes/v2-mecanica1/01-cinematica-1d.qmd
        - volumes/v2-mecanica1/02-cinematica-vetorial.qmd
        - volumes/v2-mecanica1/03-leis-newton.qmd
        - volumes/v2-mecanica1/04-aplicacoes-newton.qmd
        - volumes/v2-mecanica1/05-trabalho-energia.qmd
        - volumes/v2-mecanica1/06-conservacao-energia.qmd
        - volumes/v2-mecanica1/07-momento-linear.qmd
        - volumes/v2-mecanica1/08-centro-massa.qmd
    - part: "Volume III — Mecânica Clássica II"
      chapters:
        - volumes/v3-mecanica2/01-cinematica-rotacional.qmd
        - volumes/v3-mecanica2/02-dinamica-rotacional.qmd
        - volumes/v3-mecanica2/03-momento-angular.qmd
        - volumes/v3-mecanica2/04-estatica-corpos-rigidos.qmd
        - volumes/v3-mecanica2/05-gravitacao.qmd
        - volumes/v3-mecanica2/06-mhs.qmd
        - volumes/v3-mecanica2/07-oscilacoes-amortecidas.qmd
    - part: "Volume IV — Fluidos e Meios Contínuos"
      chapters:
        - volumes/v4-fluidos/01-estatica-fluidos.qmd
        - volumes/v4-fluidos/02-dinamica-fluidos.qmd
        - volumes/v4-fluidos/03-viscosidade.qmd
        - volumes/v4-fluidos/04-elasticidade.qmd
    - part: "Volume V — Ondas e Acústica"
      chapters:
        - volumes/v5-ondas/01-movimento-ondulatorio.qmd
        - volumes/v5-ondas/02-ondas-meios.qmd
        - volumes/v5-ondas/03-superposicao-interferencia.qmd
        - volumes/v5-ondas/04-ondas-estacionarias.qmd
        - volumes/v5-ondas/05-som-acustica.qmd
        - volumes/v5-ondas/06-efeito-doppler.qmd
    - part: "Volume VI — Termodinâmica e Física Estatística"
      chapters:
        - volumes/v6-termodinamica/01-temperatura-dilatacao.qmd
        - volumes/v6-termodinamica/02-calor-primeira-lei.qmd
        - volumes/v6-termodinamica/03-teoria-cinetica.qmd
        - volumes/v6-termodinamica/04-segunda-lei-entropia.qmd
        - volumes/v6-termodinamica/05-ciclos-maquinas.qmd
        - volumes/v6-termodinamica/06-transicoes-fase.qmd
        - volumes/v6-termodinamica/07-fisica-estatistica.qmd
    - part: "Volume VII — Eletromagnetismo I"
      chapters:
        - volumes/v7-eletromagnetismo1/01-carga-coulomb.qmd
        - volumes/v7-eletromagnetismo1/02-campo-eletrico.qmd
        - volumes/v7-eletromagnetismo1/03-lei-gauss.qmd
        - volumes/v7-eletromagnetismo1/04-potencial-eletrico.qmd
        - volumes/v7-eletromagnetismo1/05-capacitancia.qmd
        - volumes/v7-eletromagnetismo1/06-corrente-resistencia.qmd
        - volumes/v7-eletromagnetismo1/07-circuitos-dc.qmd
    - part: "Volume VIII — Eletromagnetismo II"
      chapters:
        - volumes/v8-eletromagnetismo2/01-campo-magnetico.qmd
        - volumes/v8-eletromagnetismo2/02-fontes-campo-magnetico.qmd
        - volumes/v8-eletromagnetismo2/03-inducao-eletromagnetica.qmd
        - volumes/v8-eletromagnetismo2/04-indutancia.qmd
        - volumes/v8-eletromagnetismo2/05-circuitos-ac.qmd
  appendices:
    - constantes.qmd

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
    html-math-method: mathjax
  pdf:
    documentclass: scrbook
    number-sections: true
    toc: true

